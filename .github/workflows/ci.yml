name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"

      - name: Restore
        run: dotnet restore gesFactuSolucion.sln

      - name: Build
        run: dotnet build gesFactuSolucion.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test gesFactuSolucion.sln --configuration Release --no-build --verbosity normal
