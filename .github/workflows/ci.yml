name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: GesFactu_CI_2026_Strong
          POSTGRES_DB: gesfactu_migration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gesfactu_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GESFACTU_TEST_POSTGRESQL: "Host=localhost;Port=5432;Username=postgres;Password=GesFactu_CI_2026_Strong;Include Error Detail=true"
      GESFACTU_DESIGN_CONNECTION: "Host=localhost;Port=5432;Database=gesfactu_migration_ci;Username=postgres;Password=GesFactu_CI_2026_Strong;Include Error Detail=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block committed certificates and secrets
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(git ls-files | grep -Ei '\.(pfx|p12|pem|key)
        with:
          dotnet-version: "8.0.404"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore application
        run: dotnet restore gesFactuSolucion.sln

      - name: Restore tests
        run: dotnet restore src/Infrastructure.Tests/gesFactu.Infrastructure.Tests.csproj

      - name: Restore AEAT E2E tests
        run: dotnet restore src/AeatE2ETests/gesFactu.AeatE2ETests.csproj

      - name: Build application
        run: dotnet build gesFactuSolucion.sln --configuration Release --no-restore

      - name: Validate EF migrations
        run: >
          dotnet ef database update
          --project src/Infrastructure/gesFactu.Infrastructure.csproj
          --startup-project src/Api/gesFactu.Api/gesFactu.Api.csproj
          --connection "$GESFACTU_DESIGN_CONNECTION"

      - name: Run infrastructure tests
        run: dotnet test src/Infrastructure.Tests/gesFactu.Infrastructure.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Verify AEAT E2E test project
        run: dotnet test src/AeatE2ETests/gesFactu.AeatE2ETests.csproj --configuration Release --no-restore --verbosity normal
 || true)"
          if [ -n "$forbidden_files" ]; then
            echo "Forbidden private certificate/key files are tracked:"
            echo "$forbidden_files"
            exit 1
          fi

          if git grep -n -E '"PfxPassword"[[:space:]]*:[[:space:]]*"[^"]+"' -- '*.json' '*.yml' '*.yaml'; then
            echo "A non-empty PfxPassword is committed."
            exit 1
          fi

          if git grep -n -E '"AdminApiKey"[[:space:]]*:[[:space:]]*"[^"]+"' -- '*.json' '*.yml' '*.yaml'; then
            echo "A non-empty AdminApiKey is committed."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore application
        run: dotnet restore gesFactuSolucion.sln

      - name: Restore tests
        run: dotnet restore src/Infrastructure.Tests/gesFactu.Infrastructure.Tests.csproj

      - name: Restore AEAT E2E tests
        run: dotnet restore src/AeatE2ETests/gesFactu.AeatE2ETests.csproj

      - name: Build application
        run: dotnet build gesFactuSolucion.sln --configuration Release --no-restore

      - name: Validate EF migrations
        run: >
          dotnet ef database update
          --project src/Infrastructure/gesFactu.Infrastructure.csproj
          --startup-project src/Api/gesFactu.Api/gesFactu.Api.csproj
          --connection "$GESFACTU_DESIGN_CONNECTION"

      - name: Run infrastructure tests
        run: dotnet test src/Infrastructure.Tests/gesFactu.Infrastructure.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Verify AEAT E2E test project
        run: dotnet test src/AeatE2ETests/gesFactu.AeatE2ETests.csproj --configuration Release --no-restore --verbosity normal
